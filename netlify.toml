[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Connie AI proxy (OpenAI key lives in Netlify env: OPENAI_API_KEY)
[[redirects]]
  from = "/api/connie"
  to = "/.netlify/functions/connie"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
