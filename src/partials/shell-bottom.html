<!-- ================= WEDDING CONCIERGE (chatbot) ================= -->
<div id="chat-nudge" role="status">Hi, I'm Connie — your concierge for trains, hotels, dress codes and anything else on this site. <button id="nudge-close" type="button" aria-label="Dismiss">✕</button></div>
<button id="chat-fab" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Ask Connie, the wedding concierge">
  <img class="fab-ico" src="images_hydrangea-single.png" alt=""><span class="fab-label">Ask Connie</span>
</button>
<div id="chat-veil"></div>
<div id="chat-panel" role="dialog" aria-label="Connie, the wedding concierge">
  <div id="chat-head"><span class="ch-t">Connie · Concierge</span><button id="chat-close" type="button" aria-label="Close Connie">Close</button></div>
  <div id="chat-log"></div>
  <div id="chat-chips"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ask Connie about trains, food, timings…" aria-label="Your question">
    <button id="chat-send" type="button" aria-label="Send">➤</button>
  </div>
</div>

<div id="bus-run" aria-hidden="true">🚌</div>

<div id="flag-modal" role="dialog" aria-modal="true" aria-label="American flag of comfort">
  <div class="flag-card">
    <svg viewBox="0 0 190 100" aria-hidden="true">
      <rect width="190" height="100" fill="#B22234"/>
      <rect y="7.7" width="190" height="7.7" fill="#fff"/>
      <rect y="23.1" width="190" height="7.7" fill="#fff"/>
      <rect y="38.5" width="190" height="7.7" fill="#fff"/>
      <rect y="53.8" width="190" height="7.7" fill="#fff"/>
      <rect y="69.2" width="190" height="7.7" fill="#fff"/>
      <rect y="84.6" width="190" height="7.7" fill="#fff"/>
      <rect width="76" height="53.8" fill="#3C3B6E"/>
    </svg>
    <p class="pledge">I pledge allegiance to the Flag of the United States of America, and to the Republic for which it stands…</p>
    <button class="btn usa" id="pledge-btn" type="button">🇺🇸 I pledge allegiance</button>
  </div>
</div>

<div id="tp-overlay" role="dialog" aria-modal="true" aria-label="Bridal party stat card">
  <div class="tp-big">
    <button class="tp-close" id="tp-close" type="button" aria-label="Close">✕</button>
    <div class="tp-band"><span id="tpb-role"></span></div>
    <div class="tp-face" id="tpb-face"></div>
    <h4 style="text-align:center;margin:.7rem 0 0" id="tpb-name"></h4>
    <div class="tp-stats" id="tpb-stats"></div>
    <div class="tp-facts" id="tpb-facts"></div>
  </div>
</div>
